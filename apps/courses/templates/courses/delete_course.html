
{% extends "base.html" %}

{% block title %}Delete Course | LearnHub{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete Course?</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ course.title }}</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Course</button>
        <a href="{% url 'instructor_dashboard' %}">
            Cancel
        </a>
    </form>
</div>
{% endblock %}


{% extends "base.html" %}

{% block title %}Create Course | LearnHub{% endblock %}

{% block content %}
<div class="card">
    <h1>Create New Course</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="title">Course Title</label>
        <input
            type="text"
            id="title"
            name="title"
            required
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
            required
        ></textarea>

        <label for="price">Price (₹)</label>
        <input
            type="number"
            id="price"
            name="price"
            min="0"
            step="0.01"
            value="0"
            required
        >

        <button type="submit">Create Course</button>
    </form>
</div>
{% endblock %}

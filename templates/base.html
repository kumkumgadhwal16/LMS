
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LearnHub LMS{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #222;
        }

        .navbar {
            background-color: #1e3a8a;
            padding: 16px 30px;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .navbar .brand {
            font-size: 22px;
            font-weight: bold;
            margin-right: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .course-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 18px;
        }

        .card h2 {
            margin-top: 0;
        }

        .card a {
            color: #1d4ed8;
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    


/* Registration UI */
.register-page {
    padding: 20px 0;
}

.register-card {
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    max-width: 1050px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(37, 70, 150, 0.12);
}

.register-info {
    padding: 45px 32px;
    color: white;
    background: linear-gradient(145deg, #2458e8, #6958e8);
}

.eyebrow {
    font-size: 12px;
    letter-spacing: 1.5px;
    font-weight: bold;
}

.register-info h1 {
    font-size: 34px;
    line-height: 1.25;
    margin: 22px 0 15px;
}

.register-info p {
    line-height: 1.7;
}

.feature {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-top: 26px;
}

.feature > span {
    font-size: 24px;
    background: rgba(255,255,255,.16);
    padding: 10px;
    border-radius: 12px;
}

.feature h3 {
    margin: 4px 0;
    font-size: 16px;
}

.feature p {
    margin: 5px 0;
    font-size: 13px;
    color: #e7ecff;
}

.register-form-section {
    padding: 38px;
}

.form-icon {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 12px;
    color: #2458e8;
    background: #edf2ff;
    font-size: 23px;
}

.form-heading h2 {
    color: #172554;
    margin-bottom: 8px;
}

.form-heading p,
.login-text {
    color: #64748b;
}

.register-form-section .form-group {
    margin: 18px 0;
}

.register-form-section label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

.register-form-section input,
.register-form-section select {
    width: 100%;
    min-height: 46px;
    padding: 11px;
    border: 1px solid #d7deeb;
    border-radius: 9px;
    background: white;
    font: inherit;
}

.register-form-section input:focus,
.register-form-section select:focus {
    outline: 2px solid #c7d7ff;
    border-color: #3563e9;
}

.register-form-section small {
    display: block;
    margin-top: 6px;
    color: #64748b;
}

.register-button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: #2458e8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.register-button:hover {
    background: #1d45bd;
}

.register-message {
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    background: #ecfdf5;
    color: #047857;
}

.login-text {
    margin-top: 22px;
    text-align: center;
    font-size: 14px;
}

.login-text a {
    color: #2458e8;
    font-weight: bold;
    text-decoration: none;
}

@media (max-width: 760px) {
    .register-card {
        grid-template-columns: 1fr;
    }

    .register-info {
        padding: 28px 24px;
    }

    .register-info h1 {
        font-size: 28px;
    }

    .register-form-section {
        padding: 25px 22px;
    }
}



/* Student Dashboard */
.student-welcome {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 30px;
    margin-bottom: 28px;
    border-radius: 18px;
    background: linear-gradient(120deg, #eaf0ff, #f4edff);
}

.dashboard-label {
    color: #3659cf;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.student-welcome h1 {
    margin: 10px 0;
    color: #172554;
    font-size: 30px;
}

.student-welcome p {
    color: #64748b;
    line-height: 1.6;
}

.dashboard-button {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 9px;
    background: #2458e8;
    color: white;
    text-decoration: none;
    font-weight: bold;
    white-space: nowrap;
}

.dashboard-button:hover {
    background: #1d45bd;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.dashboard-card {
    padding: 24px;
    border: 1px solid #e5eaf3;
    border-radius: 15px;
    background: white;
    box-shadow: 0 5px 20px rgba(30, 58, 138, 0.05);
}

.dashboard-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #edf2ff;
    font-size: 25px;
}

.dashboard-card h3 {
    color: #172554;
    margin: 18px 0 10px;
}

.dashboard-card p {
    min-height: 48px;
    color: #64748b;
    line-height: 1.6;
}

.dashboard-card a {
    color: #2458e8;
    text-decoration: none;
    font-weight: bold;
}

.dashboard-bottom {
    padding: 30px;
    text-align: center;
    border: 1px solid #e5eaf3;
    border-radius: 15px;
    background: white;
}

.dashboard-bottom h2 {
    color: #172554;
}

.dashboard-bottom p {
    color: #64748b;
    line-height: 1.7;
}

@media (max-width: 800px) {
    .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .student-welcome {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 550px) {
    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .student-welcome {
        padding: 22px;
    }

    .student-welcome h1 {
        font-size: 24px;
    }
}


/* My Courses Progress */
.progress-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 18px 0 9px;
    color: #475569;
    font-size: 13px;
}

.progress-info strong {
    color: #2458e8;
}

.progress-track {
    height: 9px;
    width: 100%;
    overflow: hidden;
    background: #e8edf7;
    border-radius: 20px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2458e8, #7562ed);
    border-radius: 20px;
    transition: width 0.3s ease;
}

.lesson-count {
    min-height: auto !important;
    margin: 12px 0;
    font-size: 13px;
}

.course-status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.course-status.completed {
    color: #047857;
    background: #d1fae5;
}

.course-status.in-progress {
    color: #92400e;
    background: #fef3c7;
}

.course-action {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #e5eaf3;
}

.course-action a {
    color: #2458e8;
    text-decoration: none;
    font-weight: 700;
}
    
    </style>
</head>

<body>
    

    
<nav class="navbar">
    <a class="brand" href="/">LearnHub</a>
    <a href="/">Home</a>
    <a href="/courses/">Courses</a>
    <a href="/accounts/login/">Login</a>
    <a href="/register/">Register</a>
</nav>
    

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 LearnHub LMS</p>
    </footer>

</body>
</html>

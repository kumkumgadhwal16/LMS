
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LearnHub LMS{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #222;
        }

        .navbar {
            background-color: #1e3a8a;
            padding: 16px 30px;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .navbar .brand {
            font-size: 22px;
            font-weight: bold;
            margin-right: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .course-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 18px;
        }

        .card h2 {
            margin-top: 0;
        }

        .card a {
            color: #1d4ed8;
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a class="brand" href="/">LearnHub</a>
        <a href="/">Home</a>
        <a href="/courses/">Courses</a>
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 LearnHub LMS</p>
    </footer>

</body>
</html>
